[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pollution-ai"
version = "0.1.0"
description = "Pollution anomaly detection using Copernicus satellite data"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.141.1",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "python-dotenv==1.2.3",
    "rasterio==1.5.1",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]